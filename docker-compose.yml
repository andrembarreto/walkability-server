services:
  server:
    build: .
    container_name: python-uv-server
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    # Sobrescreva o comando aqui durante o desenvolvimento para usar live-reload, se necessário
    # command: uvicorn infra.api.main:app --app-dir src --reload --host 0.0.0.0 --port 8000